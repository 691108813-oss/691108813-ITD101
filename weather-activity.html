<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ตรวจอากาศก่อนออกไป</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef3f6;
    --panel: #ffffff;
    --ink: #1e2a32;
    --ink-soft: #55636b;
    --line: #d7e1e7;
    --accent: #2f855a;
    --accent-soft: #e3f0e8;
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  body[data-category="hot"]  { --accent: #d9480f; --accent-soft: #fbe6da; }
  body[data-category="rain"] { --accent: #2b6cb0; --accent-soft: #dfeaf5; }
  body[data-category="uv"]   { --accent: #a67908; --accent-soft: #f5ecd6; }
  body[data-category="wind"] { --accent: #5c6b73; --accent-soft: #e6e9ea; }
  body[data-category="good"] { --accent: #2f855a; --accent-soft: #e3f0e8; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: "Sarabun", sans-serif;
    font-weight: 400;
    display: flex;
    justify-content: center;
    padding: 48px 20px;
    transition: background-color 0.3s ease;
  }

  main {
    width: 100%;
    max-width: 640px;
  }

  h1 {
    font-size: 1.7rem;
    font-weight: 700;
    line-height: 1.35;
    margin: 0 0 6px;
  }

  .subtitle {
    color: var(--ink-soft);
    font-size: 1rem;
    margin: 0 0 32px;
  }

  .controls {
    display: flex;
    gap: 10px;
    margin-bottom: 24px;
  }

  select, button {
    font-family: inherit;
    font-size: 1rem;
    border-radius: var(--radius);
    border: 1px solid var(--line);
    padding: 12px 14px;
    background: var(--panel);
    color: var(--ink);
  }

  select {
    flex: 1;
    min-width: 0;
  }

  button {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity 0.2s ease;
  }

  button:hover { opacity: 0.9; }
  button:disabled { opacity: 0.6; cursor: not-allowed; }

  select:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 24px;
    min-height: 140px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .state-text {
    color: var(--ink-soft);
    font-size: 0.98rem;
  }

  .result-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 18px;
  }

  .result-header h2 {
    font-size: 1.15rem;
    font-weight: 600;
    margin: 0;
  }

  .temperature {
    font-size: 2.4rem;
    font-weight: 700;
  }

  .stat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px 20px;
    margin-bottom: 20px;
  }

  .stat-label {
    color: var(--ink-soft);
    font-size: 0.85rem;
    margin-bottom: 2px;
  }

  .stat-value {
    font-size: 1.05rem;
    font-weight: 500;
  }

  .recommendation {
    border-left: 4px solid var(--accent);
    background: var(--accent-soft);
    border-radius: 0 6px 6px 0;
    padding: 14px 16px;
    font-size: 0.98rem;
    line-height: 1.6;
  }

  .checked-at {
    margin-top: 14px;
    color: var(--ink-soft);
    font-size: 0.85rem;
  }

  @media (max-width: 480px) {
    .controls { flex-direction: column; }
    .stat-grid { grid-template-columns: 1fr; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<main>
  <h1>ตรวจอากาศก่อนออกไป</h1>
  <p class="subtitle">เลือกจังหวัด แล้วดูว่าวันนี้เหมาะกับกิจกรรมกลางแจ้งแค่ไหน</p>

  <div class="controls">
    <select id="province-select" aria-label="เลือกจังหวัด">
      <option value="" disabled selected>เลือกจังหวัด</option>
    </select>
    <button id="check-button" type="button">ตรวจสอบ</button>
  </div>

  <div class="panel" id="panel">
    <p class="state-text" id="state-text">เลือกจังหวัดเพื่อเริ่มตรวจสอบสภาพอากาศ</p>
  </div>
</main>

<script>
  const PROVINCES = [
    { name: 'กรุงเทพมหานคร', lat: 13.7563, lon: 100.5018 },
    { name: 'เชียงใหม่',     lat: 18.7883, lon: 98.9853  },
    { name: 'ขอนแก่น',       lat: 16.4322, lon: 102.8236 },
    { name: 'ชลบุรี',        lat: 13.3611, lon: 100.9847 },
    { name: 'ภูเก็ต',        lat: 7.8804,  lon: 98.3923  },
  ];

  const selectEl = document.getElementById('province-select');
  const buttonEl = document.getElementById('check-button');
  const panelEl = document.getElementById('panel');

  PROVINCES.forEach((p, i) => {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = p.name;
    selectEl.appendChild(opt);
  });

  function buildUrl(lat, lon) {
    return 'https://api.open-meteo.com/v1/forecast'
      + `?latitude=${lat}`
      + `&longitude=${lon}`
      + '&current=temperature_2m,relative_humidity_2m,wind_speed_10m'
      + '&daily=precipitation_probability_max,uv_index_max'
      + '&timezone=Asia%2FBangkok'
      + '&forecast_days=1';
  }

  async function fetchWeather(lat, lon) {
    const response = await fetch(buildUrl(lat, lon));
    if (!response.ok) {
      throw new Error('เชื่อมต่อ API ไม่สำเร็จ');
    }
    return response.json();
  }

  function getRecommendation({ temperature, rainProbability, uvIndex, windSpeed }) {
    if (temperature >= 35) {
      return { category: 'hot', text: 'อากาศร้อนมาก ควรหลีกเลี่ยงกิจกรรมกลางแจ้งในช่วงกลางวัน' };
    }
    if (rainProbability >= 60) {
      return { category: 'rain', text: 'มีโอกาสฝนตกสูง ควรพกร่มหรือเสื้อกันฝนติดตัว' };
    }
    if (uvIndex >= 8) {
      return { category: 'uv', text: 'ดัชนี UV สูง ควรทาครีมกันแดดและสวมหมวกหรือแว่นกันแดด' };
    }
    if (windSpeed >= 40) {
      return { category: 'wind', text: 'ลมแรง ควรระมัดระวังการทำกิจกรรมกลางแจ้งที่ใช้ร่มหรืออุปกรณ์เบา' };
    }
    return { category: 'good', text: 'สภาพอากาศเหมาะสำหรับทำกิจกรรมกลางแจ้ง' };
  }

  function renderLoading() {
    panelEl.innerHTML = '<p class="state-text">กำลังตรวจสอบสภาพอากาศ...</p>';
  }

  function renderError(message) {
    panelEl.innerHTML = `<p class="state-text">${message} ลองกดตรวจสอบอีกครั้ง</p>`;
  }

  function renderResult(provinceName, data) {
    const temperature = data.current.temperature_2m;
    const humidity = data.current.relative_humidity_2m;
    const windSpeed = data.current.wind_speed_10m;
    const rainProbability = data.daily.precipitation_probability_max[0];
    const uvIndex = data.daily.uv_index_max[0];

    const recommendation = getRecommendation({ temperature, rainProbability, uvIndex, windSpeed });
    document.body.dataset.category = recommendation.category;

    const checkedAt = new Date(data.current.time).toLocaleString('th-TH', {
      hour: '2-digit',
      minute: '2-digit',
      day: 'numeric',
      month: 'short',
    });

    panelEl.innerHTML = `
      <div class="result-header">
        <h2>${provinceName}</h2>
        <span class="temperature">${Math.round(temperature)}°C</span>
      </div>
      <div class="stat-grid">
        <div>
          <p class="stat-label">ความชื้น</p>
          <p class="stat-value">${humidity}%</p>
        </div>
        <div>
          <p class="stat-label">ความเร็วลม</p>
          <p class="stat-value">${windSpeed} กม./ชม.</p>
        </div>
        <div>
          <p class="stat-label">โอกาสเกิดฝน</p>
          <p class="stat-value">${rainProbability}%</p>
        </div>
        <div>
          <p class="stat-label">ดัชนี UV</p>
          <p class="stat-value">${uvIndex}</p>
        </div>
      </div>
      <div class="recommendation">${recommendation.text}</div>
      <p class="checked-at">ตรวจสอบล่าสุด ${checkedAt} น.</p>
    `;
  }

  async function checkWeather() {
    const index = selectEl.value;
    if (index === '') {
      renderError('กรุณาเลือกจังหวัดก่อน');
      return;
    }

    const province = PROVINCES[index];
    buttonEl.disabled = true;
    renderLoading();

    try {
      const data = await fetchWeather(province.lat, province.lon);
      renderResult(province.name, data);
    } catch (err) {
      renderError('ไม่สามารถโหลดข้อมูลอากาศได้ อาจเกิดจากอินเทอร์เน็ตขัดข้องหรือ API ไม่ตอบสนอง');
    } finally {
      buttonEl.disabled = false;
    }
  }

  buttonEl.addEventListener('click', checkWeather);
</script>
</body>
</html>
